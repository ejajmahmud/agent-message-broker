[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-message-broker"
version = "0.1.0"
description = "Topic-based priority queue broker with dead-letter queue and replay capability"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-message-broker = "agent_message_broker.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_message_broker*"]
